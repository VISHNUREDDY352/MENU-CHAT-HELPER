<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpiceRoute — Restaurant Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --gold: #e6a817;
        --gold-light: #f5c842;
        --gold-glow: rgba(230, 168, 23, 0.35);
        --dark: #111318;
        --dark-2: #1a1d24;
        --dark-3: #22262f;
        --surface: #ffffff;
        --surface-2: #f7f8fa;
        --text: #1a1d24;
        --text-muted: #6b7280;
        --green: #16a34a;
        --red: #dc2626;
        --orange: #ea580c;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 2px 16px rgba(0,0,0,0.08);
        --shadow-hover: 0 8px 32px rgba(0,0,0,0.14);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--surface-2);
        color: var(--text);
        line-height: 1.6;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

      /* ── Navbar ── */
      .sr-nav {
        background: var(--dark);
        padding: 0 2rem;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      }
      .sr-nav-brand {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        color: var(--gold);
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .sr-nav-sub {
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        color: #9ca3af;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* ── Cart bar ── */
      .sr-cart {
        background: var(--dark-2);
        border-bottom: 2px solid var(--gold);
        padding: 0.6rem 2rem;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        min-height: 48px;
      }
      .sr-cart-empty {
        color: #9ca3af;
        font-size: 0.875rem;
      }
      .sr-cart-label {
        color: var(--gold);
        font-weight: 600;
        font-size: 0.875rem;
        margin-right: 0.25rem;
      }
      .sr-cart-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--dark-3);
        color: #e5e7eb;
        font-size: 0.8rem;
        padding: 0.25rem 0.6rem;
        border-radius: 99px;
        border: 1px solid #374151;
      }
      .sr-cart-chip button {
        background: none;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        font-size: 0.7rem;
        line-height: 1;
        padding: 0;
        transition: color 0.15s;
      }
      .sr-cart-chip button:hover { color: #ef4444; }
      .sr-cart-total {
        margin-left: auto;
        font-weight: 700;
        color: var(--gold-light);
        font-size: 0.95rem;
      }

      /* ── Layout ── */
      .sr-layout {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 1.5rem;
        padding: 1.5rem 2rem;
        max-width: 1400px;
        margin: 0 auto;
        align-items: start;
      }
      @media (max-width: 1024px) {
        .sr-layout { grid-template-columns: 1fr; }
      }

      /* ── Category section ── */
      .sr-category-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--dark);
        padding-bottom: 0.6rem;
        margin-bottom: 1rem;
        border-bottom: 2px solid var(--gold);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      /* ── Menu cards ── */
      .sr-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }
      .sr-card {
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        border: 2px solid transparent;
      }
      .sr-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
      }
      .sr-card.highlighted {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px var(--gold-glow), var(--shadow-hover);
      }
      .sr-card-img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        display: block;
      }
      .sr-ai-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: var(--gold);
        color: var(--dark);
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.2rem 0.5rem;
        border-radius: 99px;
        letter-spacing: 0.5px;
      }
      .sr-card-body {
        padding: 0.85rem;
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 0.35rem;
      }
      .sr-card-name {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text);
        line-height: 1.3;
      }
      .sr-card-desc {
        font-size: 0.75rem;
        color: var(--text-muted);
        line-height: 1.4;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .sr-card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .sr-tag {
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.15rem 0.45rem;
        border-radius: 99px;
        letter-spacing: 0.3px;
      }
      .sr-tag-veg   { background: #dcfce7; color: #15803d; }
      .sr-tag-nonveg { background: #fee2e2; color: #b91c1c; }
      .sr-tag-spicy { background: #ffedd5; color: #c2410c; }
      .sr-card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.4rem;
      }
      .sr-price {
        font-weight: 700;
        font-size: 1rem;
        color: var(--green);
      }
      .sr-add-btn {
        background: var(--gold);
        color: var(--dark);
        border: none;
        border-radius: var(--radius-sm);
        padding: 0.3rem 0.75rem;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .sr-add-btn:hover { background: var(--gold-light); transform: scale(1.05); }
      .sr-add-btn:active { transform: scale(0.97); }

      /* ── Chat panel ── */
      .sr-chat {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        height: calc(100vh - 160px);
        min-height: 500px;
        position: sticky;
        top: 80px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
      }
      .sr-chat-header {
        background: var(--dark);
        color: var(--gold);
        padding: 1rem 1.25rem;
        font-weight: 700;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border-bottom: 2px solid var(--gold);
        flex-shrink: 0;
      }
      .sr-chat-header span.dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #22c55e;
        margin-left: auto;
      }
      .sr-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        background: var(--surface-2);
      }
      .sr-msg {
        display: flex;
        flex-direction: column;
        max-width: 85%;
      }
      .sr-msg.user { align-self: flex-end; align-items: flex-end; }
      .sr-msg.bot  { align-self: flex-start; align-items: flex-start; }
      .sr-msg-bubble {
        padding: 0.6rem 0.9rem;
        border-radius: 14px;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      .sr-msg.user .sr-msg-bubble {
        background: var(--gold);
        color: var(--dark);
        border-bottom-right-radius: 4px;
        font-weight: 500;
      }
      .sr-msg.bot .sr-msg-bubble {
        background: var(--surface);
        color: var(--text);
        border: 1px solid #e5e7eb;
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      }
      .sr-typing {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 0.6rem 0.9rem;
        background: var(--surface);
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        border-bottom-left-radius: 4px;
        width: fit-content;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      }
      .sr-typing span {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #9ca3af;
        animation: bounce 1.2s infinite;
      }
      .sr-typing span:nth-child(2) { animation-delay: 0.2s; }
      .sr-typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-5px); }
      }
      .sr-chat-input {
        padding: 0.75rem;
        background: var(--surface);
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .sr-chat-input input {
        flex: 1;
        border: 1.5px solid #e5e7eb;
        border-radius: var(--radius-sm);
        padding: 0.55rem 0.9rem;
        font-size: 0.875rem;
        font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.15s;
        background: var(--surface-2);
        color: var(--text);
      }
      .sr-chat-input input:focus { border-color: var(--gold); background: var(--surface); }
      .sr-chat-input input::placeholder { color: #9ca3af; }
      .sr-send-btn {
        background: var(--dark);
        color: var(--gold);
        border: none;
        border-radius: var(--radius-sm);
        padding: 0.55rem 1rem;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .sr-send-btn:hover:not(:disabled) { background: var(--dark-3); }
      .sr-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ── Chips / quick prompts ── */
      .sr-quick-chips {
        padding: 0.5rem 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        border-top: 1px solid #f3f4f6;
        background: var(--surface);
        flex-shrink: 0;
      }
      .sr-chip {
        background: var(--surface-2);
        border: 1px solid #e5e7eb;
        border-radius: 99px;
        padding: 0.2rem 0.65rem;
        font-size: 0.72rem;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s;
      }
      .sr-chip:hover { background: #fef3c7; border-color: var(--gold); color: var(--dark); }

      /* ── Loading spinner ── */
      .sr-spinner {
        width: 48px; height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .sr-loading-screen {
        position: fixed; inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--dark);
        gap: 1rem;
      }
      .sr-loading-brand {
        font-family: 'Playfair Display', serif;
        font-size: 2rem;
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
